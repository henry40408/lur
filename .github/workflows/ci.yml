name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time. A newer push supersedes the run it interrupted;
# a tag does not — a tagged build publishes one specific version and nothing
# should quietly cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      LUR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: nextest
      - name: nextest
        run: cargo nextest run

  coverage:
    runs-on: ubuntu-latest
    # Runs the full suite (incl. tests/pg.rs) under instrumentation, so it needs
    # the same Postgres service as the `test` job — without it the CI-hard-fail
    # path in the pg tests fires (CI is set on every job, but Postgres would be
    # absent).
    services:
      postgres:
        image: postgres@sha256:dc17045ccfd343b49600570ea734b9c4991cf1c3f3302e67df51e3b402dd55c4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      LUR_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-llvm-cov installs the llvm-tools-preview component itself, so the
      # toolchain needs no extra declaration beyond rust-toolchain.toml.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov,nextest
      - name: Collect coverage (llvm source-based, via nextest)
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # Don't fail the job on an upload hiccup — coverage is a signal, not a gate.
          fail_ci_if_error: false

  perf:
    runs-on: ubuntu-latest
    permissions:
      contents: write # record the moving baseline to gh-pages on push to main
      pull-requests: write # comment on a regression alert on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run benchmarks
        # Criterion emits the libtest "bencher" format that tool:cargo parses.
        #
        # Drop any restored Criterion state first. rust-cache prunes target/ but
        # leaves target/criterion/<bench>/ standing without its base/sample.json,
        # and Criterion then fails loading that baseline *mid-line*, splicing
        #   Criterion.rs ERROR: ... No such file or directory
        # into the "test <name> ... bench: <n> ns/iter" line this format is meant
        # to produce. That breaks the tool:cargo parser, which reports "No
        # benchmark result was found" and fails the job — not an alert, so
        # fail-on-alert: false does not cover it. Nothing is lost: the moving
        # baseline this job compares against lives in gh-pages (see
        # benchmark-data-dir-path below), never in target/criterion.
        run: |
          rm -rf target/criterion
          cargo bench --bench runtime -- --output-format bencher | tee output.txt
      - name: Store result and report regressions
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          name: lur criterion
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Record the moving baseline only on push to main; PRs compare to it.
          auto-push: ${{ github.event_name == 'push' }}
          # Informational only: wall-clock on shared runners is too noisy for a
          # hard gate (a no-op change measured 1.85x vs the baseline once), so
          # the comparison is surfaced as a PR comment + summary but never blocks
          # the merge. lint and test remain hard gates.
          fail-on-alert: false
          alert-threshold: "150%"
          comment-on-alert: true
          summary-always: true

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-deny
      # Hard gate: advisories (RUSTSEC), bans, licenses, and sources all checked
      # on every push and PR. Config lives in deny.toml.
      - name: cargo deny
        run: cargo deny check
